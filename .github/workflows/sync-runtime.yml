name: Sync generated extension runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate runtime JavaScript
        run: npm run build:extension

      - name: Verify generated runtime
        run: npm run validate

      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            background.js extension-storage-watch.js extension-storage.js extensions.js \
            guide.js history.js i18n.js legacy-crypto.js options.js popup-fixes.js \
            popup-i18n.js popup.js runtime.js sync-core.js theme.js update.js
          if git diff --cached --quiet; then
            echo "Generated runtime is already synchronized."
            exit 0
          fi
          git commit -m "build: sync generated extension runtime"
          git push
