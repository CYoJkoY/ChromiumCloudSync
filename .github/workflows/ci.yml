name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, and run Chromium smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Chromium and Xvfb are available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get install -y chromium
          fi
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get install -y xvfb
          fi
          chromium --version
          Xvfb -version

      - name: Validate source and build
        run: npm run validate

      - name: Run Chromium runtime smoke test
        run: npm run test:browser
