name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify TypeScript-only source tree
        shell: bash
        run: |
          set -euo pipefail
          JS_FILES="$(git ls-files -- '*.js')"
          if [[ -n "$JS_FILES" ]]; then
            echo "JavaScript source files are forbidden in the repository:"
            printf '%s\n' "$JS_FILES"
            exit 1
          fi
          echo "No tracked .js source files found."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check strict core
        run: npm run typecheck

      - name: Validate source, build, and tests
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: xvfb-run --auto-servernum npm run smoke

      - name: Build release ZIP
        run: npm run build:zip

      - name: Verify release ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")"
          VERSION="${VERSION_NAME:-$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")}" 
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          test -f "$ZIP"
          unzip -t "$ZIP"
          FILES="$(unzip -Z1 "$ZIP")"
          REQUIRED_FILES=(
            "manifest.json"
            "background.js"
            "legacy-crypto.js"
            "sync-core.js"
            "i18n.js"
            "theme.js"
            "runtime.js"
            "update.js"
            "extension-storage.js"
            "extension-storage-watch.js"
            "popup.html"
            "popup.js"
            "options.html"
            "options.js"
            "history.html"
            "history.js"
            "guide.html"
            "guide.js"
            "extensions.html"
            "extensions.js"
            "popup-fixes.js"
            "ui.css"
            "ui-system.css"
            "ui-overrides.css"
            "_locales/en/messages.json"
            "_locales/zh_CN/messages.json"
            "icons/icon.svg"
          )
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            grep -Fxq "$REQUIRED" <<< "$FILES" || { echo "Missing required ZIP entry: $REQUIRED"; exit 1; }
          done

          while IFS= read -r FILE; do
            case "$FILE" in
              manifest.json|background.js|legacy-crypto.js|sync-core.js|i18n.js|theme.js|runtime.js|update.js|extension-storage.js|extension-storage-watch.js|popup.html|popup.js|options.html|options.js|history.html|history.js|guide.html|guide.js|extensions.html|extensions.js|popup-fixes.js|ui.css|ui-system.css|ui-overrides.css|_locales/en/messages.json|_locales/zh_CN/messages.json|icons/icon.svg|icons/icon16.png|icons/icon32.png|icons/icon48.png|icons/icon128.png|icons/icon256.png|icons/icon512.png) ;;
              *) echo "Unexpected ZIP entry: $FILE"; exit 1 ;;
            esac
          done <<< "$FILES"
          echo "ZIP contains only approved extension files."
