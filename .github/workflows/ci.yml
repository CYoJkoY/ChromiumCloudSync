name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify TypeScript-only source tree
        shell: bash
        run: |
          set -euo pipefail
          JS_FILES="$(git ls-files -- '*.js')"
          if [[ -n "$JS_FILES" ]]; then
            echo "JavaScript source files are forbidden in the repository:"
            printf '%s\n' "$JS_FILES"
            exit 1
          fi
          echo "No tracked .js source files found."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source, build, and tests
        run: npm run validate

      - name: Build release ZIP
        run: npm run build:zip

      - name: Verify release ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")"
          VERSION="${VERSION_NAME:-$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")}" 
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          test -f "$ZIP"
          unzip -t "$ZIP"
          FILES="$(unzip -Z1 "$ZIP")"
          REQUIRED_FILES=(
            "manifest.json"
            "background.js"
            "legacy-crypto.js"
            "sync-core.js"
            "i18n.js"
            "theme.js"
            "runtime.js"
            "update.js"
            "extension-storage.js"
            "extension-storage-watch.js"
            "popup.html"
            "popup.js"
            "options.html"
            "options.js"
            "history.html"
            "history.js"
            "guide.html"
            "guide.js"
            "extensions.html"
            "extensions.js"
            "popup-fixes.js"
            "ui.css"
            "ui-system.css"
            "ui-overrides.css"
            "_locales/en/messages.json"
            "_locales/zh_CN/messages.json"
            "icons/icon.svg"
          )
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            grep -Fxq "$REQUIRED" <<< "$FILES" || { echo "Missing required ZIP entry: $REQUIRED"; exit 1; }
          done
