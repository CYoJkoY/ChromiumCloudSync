name: Sync package.json version

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'package.json'
      - 'scripts/sync-package-version.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-package-version-main
  cancel-in-progress: false

jobs:
  sync:
    name: Keep package.json aligned with manifest.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Synchronize package.json version
        run: npm run version:sync

      - name: Commit synchronization when needed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json; then
            echo "package.json is already synchronized with manifest.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: sync package version with manifest"
          git push origin HEAD:main
