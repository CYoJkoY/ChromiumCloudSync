name: Release Chromium Cloud Sync

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.5.14)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CRX + ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid release tag: $TAG"; echo "Expected format: vMAJOR.MINOR.PATCH"; exit 1; fi
          TAG_VERSION="${TAG#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then echo "Tag version ($TAG_VERSION) does not match manifest version ($VERSION)."; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Release tag: $TAG"

      - name: Validate project
        run: npm run validate

      - name: Build release ZIP
        run: npm run build:zip

      - name: Locate release ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          test -f "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "Release ZIP: $ZIP"

      - name: Verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          echo "Verifying ZIP integrity: $ZIP"
          unzip -t "$ZIP"
          FILES="$(unzip -Z1 "$ZIP")"
          REQUIRED_FILES=(
            "manifest.json"
            "background.js"
            "legacy-crypto.js"
            "sync-core.js"
            "i18n.js"
            "theme.js"
            "runtime.js"
            "update.js"
            "extension-storage.js"
            "ui-overrides.css"
            "popup.html"
            "popup.js"
            "options.html"
            "options.js"
            "history.html"
            "history.js"
            "guide.html"
            "guide.js"
            "ui.css"
            "_locales/en/messages.json"
            "_locales/zh_CN/messages.json"
            "icons/icon.svg"
            "icons/icon16.png"
            "icons/icon32.png"
            "icons/icon48.png"
            "icons/icon128.png"
            "icons/icon256.png"
            "icons/icon512.png"
          )
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            if ! grep -Fxq "$REQUIRED" <<< "$FILES"; then echo "Missing required file in ZIP: $REQUIRED"; exit 1; fi
          done
          echo "All required extension files are present."

      - name: Install CRX3 packer
        shell: bash
        run: |
          set -euo pipefail
          npm install --global crx3@2.0.0
          crx3 --version || true

      - name: Prepare CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${CRX_PRIVATE_KEY_B64:-}" ]]; then echo "Missing required repository secret: CRX_PRIVATE_KEY_B64"; echo "Create a stable CRX signing key and store its base64 contents in GitHub Secrets."; exit 1; fi
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/chromium-cloud-sync.pem"
          chmod 600 "$RUNNER_TEMP/chromium-cloud-sync.pem"
          test -s "$RUNNER_TEMP/chromium-cloud-sync.pem"

      - name: Build signed CRX3
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          KEY="$RUNNER_TEMP/chromium-cloud-sync.pem"
          cat "$ZIP" | crx3 -p "$KEY" -o "$CRX"
          test -s "$CRX"
          MAGIC="$(head -c 4 "$CRX")"
          if [[ "$MAGIC" != "Cr24" ]]; then echo "Generated file is not a CRX package (invalid magic header)."; exit 1; fi
          echo "Built: $CRX"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "dist/chromium-cloud-sync-v${VERSION}.zip" "dist/chromium-cloud-sync-v${VERSION}.crx" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          SUMS="dist/SHA256SUMS.txt"
          test -s "$ZIP"; test -s "$CRX"; test -s "$SUMS"
          grep -F "chromium-cloud-sync-v${VERSION}.zip" "$SUMS"
          grep -F "chromium-cloud-sync-v${VERSION}.crx" "$SUMS"
          echo "All release artifacts are ready."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" "dist/chromium-cloud-sync-v${VERSION}.zip" "dist/chromium-cloud-sync-v${VERSION}.crx" "dist/SHA256SUMS.txt" --title "Chromium Cloud Sync v${VERSION}" --generate-notes
