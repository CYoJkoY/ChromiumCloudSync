name: Release Chromium Cloud Sync

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag to build (for example v1.9.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CRX + ZIP
    runs-on: ubuntu-latest
    env:
      GDRIVE_OAUTH_CLIENT_ID: ${{ vars.GDRIVE_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify TypeScript-only source tree
        shell: bash
        run: |
          set -euo pipefail
          JS_FILES="$(git ls-files -- '*.js')"
          if [[ -n "$JS_FILES" ]]; then
            echo "JavaScript source files are forbidden in the repository:"
            printf '%s\n' "$JS_FILES"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Synchronize package.json stable version
        run: npm run version:sync

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          VERSION_NAME="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi

          if [[ -n "$VERSION_NAME" ]]; then
            echo "manifest.version_name is disabled. Remove it and use a single stable release channel."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $TAG"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Stable tag ($TAG_VERSION) does not match manifest.version ($VERSION)."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) must match manifest.version ($VERSION)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate registered Google Drive OAuth client
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="${GDRIVE_OAUTH_CLIENT_ID:-}"
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error title=Missing Google Drive OAuth client::Set GDRIVE_OAUTH_CLIENT_ID to a Google Cloud OAuth Web application client ID and register the exact https://<extension-id>.chromiumapp.org/ URI under Authorized redirect URIs."
            exit 1
          fi
          if [[ ! "$CLIENT_ID" =~ ^[A-Za-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error title=Invalid Google Drive OAuth client::GDRIVE_OAUTH_CLIENT_ID must be a Google OAuth client ID ending in .apps.googleusercontent.com."
            exit 1
          fi

      - name: Validate project
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: xvfb-run --auto-servernum npm run smoke

      - name: Build release ZIP
        run: npm run build:zip

      - name: Verify packaged Google Drive OAuth manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
          const expectedClientId = process.env.GDRIVE_OAUTH_CLIENT_ID;
          const requiredScope = "https://www.googleapis.com/auth/drive.file";
          if (!expectedClientId || manifest.oauth2?.client_id !== expectedClientId) {
            throw new Error("The release manifest does not contain the configured Google Drive OAuth Client ID.");
          }
          if (!manifest.oauth2?.scopes?.includes(requiredScope)) {
            throw new Error("The release manifest is missing the required drive.file scope.");
          }
          console.log("Google Drive redirect OAuth client ID and drive.file scope are configured in the release manifest.");
          NODE

      - name: Locate release ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          test -f "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          unzip -t "$ZIP"
          FILES="$(unzip -Z1 "$ZIP" | sed '/\/$/d')"
          REQUIRED_FILES=(
            "manifest.json"
            "background.js"
            "browser-capabilities.js"
            "cloud-files.js"
            "cloud-gist.js"
            "sync-modules.js"
            "cloud-tab-state.js"
            "diagnostics.js"
            "legacy-crypto.js"
            "schema.js"
            "storage.js"
            "sync-core.js"
            "types.js"
            "cloud-gdrive.js"
            "cloud-webdav.js"
            "extension-storage.js"
            "package-index.js"
            "gdrive-packages.js"
            "extension-storage-watch.js"
            "extension-local-source.js"
            "update.js"
            "extensions.js"
            "guide.js"
            "history.js"
            "i18n.js"
            "options.js"
            "popup.js"
            "popup-i18n.js"
            "popup-fixes.js"
            "runtime.js"
            "theme.js"
            "popup.html"
            "options.html"
            "history.html"
            "guide.html"
            "extensions.html"
            "ui.css"
            "ui-system.css"
            "ui-overrides.css"
            "_locales/en/messages.json"
            "_locales/zh_CN/messages.json"
            "icons/icon.svg"
          )
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            grep -Fxq "$REQUIRED" <<< "$FILES" || { echo "Missing required file in ZIP: $REQUIRED"; exit 1; }
          done
          while IFS= read -r FILE; do
            case "$FILE" in
              manifest.json|background.js|browser-capabilities.js|sync-modules.js|cloud-gist.js|cloud-files.js|cloud-tab-state.js|diagnostics.js|legacy-crypto.js|schema.js|storage.js|sync-core.js|cloud-gdrive.js|cloud-webdav.js|types.js|extension-storage.js|extension-storage-watch.js|package-index.js|gdrive-packages.js|update.js|extensions.js|guide.js|history.js|i18n.js|options.js|popup.js|popup-i18n.js|popup-fixes.js|runtime.js|theme.js|popup.html|options.html|history.html|guide.html|extensions.html|extension-local-source.js|ui.css|ui-system.css|ui-overrides.css|_locales/en/messages.json|_locales/zh_CN/messages.json|icons/icon.svg|icons/ChromiumCloudSync.ico|icons/icon16.png|icons/icon32.png|icons/icon48.png|icons/icon128.png|icons/icon256.png|icons/icon512.png) ;;
              *) echo "Unexpected ZIP entry: $FILE"; exit 1 ;;
            esac
          done <<< "$FILES"
          echo "ZIP contains only approved extension files."

      - name: Install CRX3 packer
        run: npm install --global crx3@2.0.0

      - name: Prepare CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${CRX_PRIVATE_KEY_B64:-}" ]]; then
            echo "::error title=Missing CRX signing key::Add the CRX_PRIVATE_KEY_B64 repository secret. Store either a PEM private key or a Base64-encoded PEM."
            exit 1
          fi

          KEY_INPUT="$RUNNER_TEMP/chromium-cloud-sync-key-input"
          KEY_PEM="$RUNNER_TEMP/chromium-cloud-sync.pem"

          # Accept a PEM pasted directly into the secret as well as the existing
          # Base64 secret format. Strip wrapping whitespace before strict decoding.
          if [[ "$CRX_PRIVATE_KEY_B64" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$CRX_PRIVATE_KEY_B64" > "$KEY_INPUT"
          else
            KEY_B64="$(printf '%s' "$CRX_PRIVATE_KEY_B64" | tr -d '[:space:]')"
            if [[ ! "$KEY_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
              echo "::error title=Invalid CRX signing key secret::CRX_PRIVATE_KEY_B64 must contain raw PEM or standard Base64 for the complete PEM file. Remove quotes, labels, and other extra text."
              exit 1
            fi
            if ! printf '%s' "$KEY_B64" | base64 --decode > "$KEY_INPUT"; then
              echo "::error title=Invalid CRX signing key encoding::Could not Base64-decode CRX_PRIVATE_KEY_B64. Re-encode the complete private.pem file as a single Base64 value, or store the raw PEM directly."
              exit 1
            fi
          fi

          # This project signs CRX3 with RSA. Validate the decoded key first,
          # then normalize PKCS#8/PKCS#1 inputs to a conventional RSA PEM.
          if ! openssl rsa -in "$KEY_INPUT" -check -noout -passin pass: >/dev/null 2>&1; then
            echo "::error title=Invalid CRX signing key::The secret did not decode to a valid unencrypted RSA private key. Supported inputs include PKCS#8 (BEGIN PRIVATE KEY) and PKCS#1 (BEGIN RSA PRIVATE KEY) PEM."
            exit 1
          fi
          if ! openssl rsa -in "$KEY_INPUT" -traditional -out "$KEY_PEM" -passin pass: >/dev/null 2>&1; then
            echo "::error title=CRX signing key normalization failed::OpenSSL could not normalize the RSA private key for CRX3."
            exit 1
          fi

          chmod 600 "$KEY_PEM"
          rm -f "$KEY_INPUT"
          test -s "$KEY_PEM"
          echo "CRX signing key decoded, validated, and normalized successfully."

      - name: Build signed CRX3
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          cat "$ZIP" | crx3 -p "$RUNNER_TEMP/chromium-cloud-sync.pem" -o "$CRX"
          test -s "$CRX"
          [[ "$(head -c 4 "$CRX")" == "Cr24" ]]

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "dist/chromium-cloud-sync-v${VERSION}.zip" "dist/chromium-cloud-sync-v${VERSION}.crx" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          SUMS="dist/SHA256SUMS.txt"
          test -s "$ZIP"
          test -s "$CRX"
          test -s "$SUMS"
          grep -F "$ZIP" "$SUMS"
          grep -F "$CRX" "$SUMS"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ARGS=(
            "$TAG"
            "dist/chromium-cloud-sync-v${VERSION}.zip"
            "dist/chromium-cloud-sync-v${VERSION}.crx"
            "dist/SHA256SUMS.txt"
            --title "Chromium Cloud Sync v${VERSION}"
            --generate-notes
          )
          gh release create "${ARGS[@]}"
