name: Release Chromium Cloud Sync

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-dev*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.7.8 or v1.7.8-dev1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CRX + ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify TypeScript-only source tree
        shell: bash
        run: |
          set -euo pipefail
          JS_FILES="$(git ls-files -- '*.js')"
          if [[ -n "$JS_FILES" ]]; then
            echo "JavaScript source files are forbidden in the repository:"
            printf '%s\n' "$JS_FILES"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Synchronize package.json stable version
        run: npm run version:sync

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          VERSION_NAME="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          IS_DEV="false"
          EFFECTIVE_VERSION="$VERSION"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
            IS_DEV="true"
            if [[ -z "$VERSION_NAME" || "$TAG_VERSION" != "$VERSION_NAME" ]]; then
              echo "Development tag ($TAG_VERSION) does not match manifest.version_name ($VERSION_NAME)."
              exit 1
            fi
            EFFECTIVE_VERSION="$VERSION_NAME"
          elif [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Stable tag ($TAG_VERSION) does not match manifest.version ($VERSION)."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) must match manifest.version ($VERSION)."
            exit 1
          fi

          echo "version=$EFFECTIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_dev=$IS_DEV" >> "$GITHUB_OUTPUT"

      - name: Validate project
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: xvfb-run --auto-servernum npm run smoke

      - name: Build release ZIP
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:zip

      - name: Locate release ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          test -f "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.zip.outputs.path }}"
          unzip -t "$ZIP"
          FILES="$(unzip -Z1 "$ZIP" | sed '/\/$/d')"
          REQUIRED_FILES=(
            "manifest.json"
            "background.js"
            "browser-capabilities.js"
            "diagnostics.js"
            "legacy-crypto.js"
            "schema.js"
            "storage.js"
            "sync-core.js"
            "types.js"
            "extension-storage.js"
            "extension-storage-watch.js"
            "update.js"
            "extensions.js"
            "guide.js"
            "history.js"
            "i18n.js"
            "options.js"
            "popup.js"
            "popup-i18n.js"
            "popup-fixes.js"
            "runtime.js"
            "theme.js"
            "popup.html"
            "options.html"
            "history.html"
            "guide.html"
            "extensions.html"
            "ui.css"
            "ui-system.css"
            "ui-overrides.css"
            "_locales/en/messages.json"
            "_locales/zh_CN/messages.json"
            "icons/icon.svg"
          )
          for REQUIRED in "${REQUIRED_FILES[@]}"; do
            grep -Fxq "$REQUIRED" <<< "$FILES" || { echo "Missing required file in ZIP: $REQUIRED"; exit 1; }
          done
          while IFS= read -r FILE; do
            case "$FILE" in
              manifest.json|background.js|browser-capabilities.js|diagnostics.js|legacy-crypto.js|schema.js|storage.js|sync-core.js|types.js|extension-storage.js|extension-storage-watch.js|update.js|extensions.js|guide.js|history.js|i18n.js|options.js|popup.js|popup-i18n.js|popup-fixes.js|runtime.js|theme.js|popup.html|options.html|history.html|guide.html|extensions.html|ui.css|ui-system.css|ui-overrides.css|_locales/en/messages.json|_locales/zh_CN/messages.json|icons/icon.svg|icons/icon16.png|icons/icon32.png|icons/icon48.png|icons/icon128.png|icons/icon256.png|icons/icon512.png) ;;
              *) echo "Unexpected ZIP entry: $FILE"; exit 1 ;;
            esac
          done <<< "$FILES"
          echo "ZIP contains only approved extension files."

      - name: Verify packaged manifest version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_STABLE="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          EXPECTED_NAME="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version_name || ''")"
          EXPECTED_RELEASE="${{ steps.version.outputs.version }}"
          ACTUAL_STABLE="$(unzip -p "${{ steps.zip.outputs.path }}" manifest.json | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>console.log(JSON.parse(s).version))")"
          ACTUAL_NAME="$(unzip -p "${{ steps.zip.outputs.path }}" manifest.json | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>console.log(JSON.parse(s).version_name || ''))")"
          if [[ "$ACTUAL_STABLE" != "$EXPECTED_STABLE" ]]; then
            echo "Packaged manifest.version ($ACTUAL_STABLE) does not match source manifest.version ($EXPECTED_STABLE)."
            exit 1
          fi
          if [[ "$EXPECTED_RELEASE" == *-dev* ]]; then
            [[ "$ACTUAL_NAME" == "$EXPECTED_NAME" && "$ACTUAL_NAME" == "$EXPECTED_RELEASE" ]] || {
              echo "Packaged manifest.version_name ($ACTUAL_NAME) does not match development release version ($EXPECTED_RELEASE)."
              exit 1
            }
          elif [[ -n "$ACTUAL_NAME" ]]; then
            echo "Stable release must not contain manifest.version_name ($ACTUAL_NAME)."
            exit 1
          fi

      - name: Install CRX3 packer
        run: npm install --global crx3@2.0.0

      - name: Prepare CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${CRX_PRIVATE_KEY_B64:-}" ]]; then
            echo "Missing required repository secret: CRX_PRIVATE_KEY_B64"
            echo "Add the base64-encoded CRX3 private key to the repository Actions secrets before creating a release."
            exit 1
          fi
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/chromium-cloud-sync.pem"
          chmod 600 "$RUNNER_TEMP/chromium-cloud-sync.pem"
          test -s "$RUNNER_TEMP/chromium-cloud-sync.pem"

      - name: Build signed CRX3
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          cat "$ZIP" | crx3 -p "$RUNNER_TEMP/chromium-cloud-sync.pem" -o "$CRX"
          test -s "$CRX"
          [[ "$(head -c 4 "$CRX")" == "Cr24" ]]

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "dist/chromium-cloud-sync-v${VERSION}.zip" "dist/chromium-cloud-sync-v${VERSION}.crx" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/chromium-cloud-sync-v${VERSION}.zip"
          CRX="dist/chromium-cloud-sync-v${VERSION}.crx"
          SUMS="dist/SHA256SUMS.txt"
          test -s "$ZIP"
          test -s "$CRX"
          test -s "$SUMS"
          grep -F "$ZIP" "$SUMS"
          grep -F "$CRX" "$SUMS"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          IS_DEV="${{ steps.version.outputs.is_dev }}"
          ARGS=(
            "$TAG"
            "dist/chromium-cloud-sync-v${VERSION}.zip"
            "dist/chromium-cloud-sync-v${VERSION}.crx"
            "dist/SHA256SUMS.txt"
            --title "Chromium Cloud Sync v${VERSION}"
            --generate-notes
          )
          if [[ "$IS_DEV" == "true" ]]; then ARGS+=(--prerelease); fi
          gh release create "${ARGS[@]}"
