name: "Sync conflict / merge result"
description: Unresolved conflicts, duplicated or resurrected items, or a merge that does not converge.
title: "[Conflict]: "
labels:
  - bug
  - conflict
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this for three-way-merge problems: unresolved field conflicts, items that
        reappear after deletion, duplicated tabs/bookmarks/groups, or a snapshot that
        keeps flipping between two devices.

        > [!CAUTION]
        > **Do not paste Gist IDs, Gist URLs, or `current.json` contents.**
        > Describe the shape of the data (field names, counts, IDs of *your own* local items)
        > instead of the raw payload.

  - type: dropdown
    id: scenario
    attributes:
      label: What kind of problem is it?
      options:
        - Unresolved conflict count never goes down
        - Deleted item comes back (tombstone not honoured)
        - Duplicated tabs / bookmarks / tab groups
        - Merge flips between two states on every sync
        - Extension version field merged incorrectly
        - URL / title changed on both sides and stayed conflicted
        - Other merge outcome
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.8.0
    validations:
      required: true

  - type: dropdown
    id: cloud_schema
    attributes:
      label: Cloud schema version
      description: The current schema is v10, with migration support for v7–v10.
      options:
        - v10
        - v9
        - v8
        - v7
        - Unknown
    validations:
      required: true

  - type: input
    id: device_count
    attributes:
      label: How many devices / browser profiles are bound to this Gist?
      placeholder: "e.g. 2 (desktop + laptop)"
    validations:
      required: true

  - type: textarea
    id: before_after
    attributes:
      label: State before and after the sync
      description: >
        What did each side look like before syncing, and what did you end up with?
        Use field names and counts, not raw JSON.
      value: |
        Before (local):
        Before (remote / other device):
        After sync:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: repeat_merge
    attributes:
      label: Does syncing again produce a *new* conflict or revision?
      options:
        - Yes — a new revision every time, conflict count stays the same
        - Yes — conflict count keeps growing
        - No — it settles after the first sync
        - Not tried
    validations:
      required: true

  - type: dropdown
    id: rollback_tried
    attributes:
      label: Did you try a rollback from History?
      options:
        - "No"
        - "Yes — and it fixed it"
        - "Yes — and the problem came back"
        - "Yes — rollback itself failed"
    validations:
      required: false

  - type: textarea
    id: expected_resolution
    attributes:
      label: What resolution did you expect?
      description: >
        For example: "the newer title should win", "the deletion on device A should be
        preserved", "these two duplicate groups should merge into one".
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I removed all tokens, Gist IDs/URLs, and sync payload contents.
          required: true
        - label: I am reporting this against the latest release.
          required: false
