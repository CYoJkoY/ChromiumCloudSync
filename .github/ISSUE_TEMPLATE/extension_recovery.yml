name: "Extension inventory / Recovery Center"
description: Missing extensions, wrong or missing store links, false positives in the Recovery Center.
title: "[Extensions]: "
labels:
  - bug
  - area:extensions
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        The inventory tracks third-party extension metadata (ID, name, version, enabled state,
        installation type, update info, store links). It intentionally does **not** sync another
        extension's private storage or settings — that is a roadmap item, not a bug.

        > [!NOTE]
        > Extension IDs and names are safe to share; your tokens are not.

  - type: dropdown
    id: symptom
    attributes:
      label: What is wrong?
      options:
        - An extension is missing from the inventory
        - An installed extension is reported as missing (false positive)
        - Recovery Center shows no store link
        - Store link points to the wrong store (Chrome Web Store vs Edge Add-ons)
        - Version / enabled state is wrong or not updating
        - The inventory is not syncing between devices
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.8.0
    validations:
      required: true

  - type: input
    id: target_extension
    attributes:
      label: Affected extension (name and/or ID)
      placeholder: "e.g. uBlock Origin — cjpalhdlnbpafiamejdnhcphjbkeiagm"
    validations:
      required: false

  - type: dropdown
    id: install_type
    attributes:
      label: How is that extension installed?
      options:
        - Normal (store install)
        - Development (loaded unpacked)
        - Sideloaded / enterprise policy
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Microsoft Edge
        - Brave
        - Vivaldi
        - Opera
        - Other
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Details
      description: What did the Recovery Center show, and what did you expect?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I understand that third-party extension settings/private storage are out of scope by design.
          required: false
        - label: I removed all tokens and credentials from this report.
          required: true
