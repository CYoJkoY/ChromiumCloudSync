<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Chromium Cloud Sync</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="ui-overrides.css">
</head>
<body class="popup-page">
<main class="popup-shell">
  <header class="page-header popup-header">
    <div class="brand">
      <div class="brand-mark"><img src="icons/icon.svg" alt=""></div>
      <div class="brand-copy"><h1 class="brand-title" data-i18n="extensionName">Chromium Cloud Sync</h1><div class="brand-sub" data-i18n="appTagline">GitHub Gist · Private cloud sync</div></div>
    </div>
    <div class="toolbar">
      <div id="language" class="choice-switch language-switch" role="radiogroup" aria-label="Language" data-value="auto">
        <span class="choice-switch-thumb" aria-hidden="true"></span>
        <button type="button" class="choice-switch-option" role="radio" data-value="zh-CN" aria-label="简体中文" aria-pressed="false"><span class="lang-option-label">中</span></button>
        <button type="button" class="choice-switch-option" role="radio" data-value="en" aria-label="English" aria-pressed="false"><span class="lang-option-label">EN</span></button>
      </div>
      <div id="theme" class="choice-switch theme-switch" role="radiogroup" aria-label="Theme" data-value="system">
        <span class="choice-switch-thumb" aria-hidden="true"></span>
        <button type="button" class="choice-switch-option theme-option" role="radio" data-value="light" aria-label="Light" aria-pressed="false">
          <svg aria-hidden="true" class="theme-art theme-art-light" viewBox="0 0 32 22" focusable="false">
            <circle class="theme-sun" cx="8.2" cy="8" r="3.55"></circle>
            <path class="theme-sun-ray" d="M8.2 1.7v1.45M8.2 12.85v1.45M1.9 8h1.45M13.05 8h1.45M3.75 3.55l1.02 1.02M11.63 11.43l1.02 1.02M12.65 3.55l-1.02 1.02M4.77 11.43l-1.02 1.02"></path>
            <path class="theme-cloud-light" d="M11.2 17.65h13.35a3.25 3.25 0 0 0 .2-6.47 4.95 4.95 0 0 0-8.62-1.23 4.25 4.25 0 0 0-4.93 7.7Z"></path>
            <path class="theme-cloud-highlight" d="M13.1 15.55c.8-1.25 2.25-1.8 3.55-1.55.9-1.42 2.6-2.12 4.25-1.8"></path>
          </svg>
        </button>
        <button type="button" class="choice-switch-option theme-option" role="radio" data-value="dark" aria-label="Dark" aria-pressed="false">
          <svg aria-hidden="true" class="theme-art theme-art-dark" viewBox="0 0 32 22" focusable="false">
            <path class="theme-moon" d="M13.45 3.25a5.65 5.65 0 1 0 4.34 9.27 6.15 6.15 0 0 1-4.34-9.27Z"></path>
            <path class="theme-star" d="M22 3.15l.62 1.32 1.44.2-1.03 1 .24 1.43L22 6.42l-1.27.68.24-1.43-1.03-1 1.44-.2.62-1.32Z"></path>
            <path class="theme-star theme-star-small" d="M26.55 8.1l.42.9.98.14-.7.68.17.97-.87-.46-.87.46.17-.97-.7-.68.98-.14.42-.9Z"></path>
            <path class="theme-cloud-dark" d="M12.2 18.05h14.15a3.35 3.35 0 0 0 .2-6.68 4.95 4.95 0 0 0-8.6-1.1 4.28 4.28 0 0 0-5.75 7.78Z"></path>
            <path class="theme-cloud-highlight-dark" d="M14.1 16.05c.8-1.18 2.16-1.72 3.42-1.48.92-1.28 2.53-1.92 4.08-1.55"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <section id="updateCard" class="card update-card" hidden>
    <div class="update-card-main">
      <div class="update-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v11"></path><path d="m8 10 4 4 4-4"></path><path d="M5 18h14"></path></svg></div>
      <div class="update-copy">
        <div id="updateTitle" class="update-title"></div>
        <div id="updateMeta" class="update-meta">
          <div id="updateCurrentVersion"></div>
          <div id="updateLatestVersion"></div>
        </div>
      </div>
    </div>
    <div class="update-actions">
      <button id="updateDownload" class="primary update-button" type="button" disabled>Download update</button>
      <button id="updateRelease" class="secondary update-button" type="button">View release</button>
    </div>
  </section>

  <section class="card status-card">
    <div id="statusIcon" class="status-icon"><svg class="icon-xl" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/><path d="M18 3v5h-5"/></svg></div>
    <div style="min-width:0;flex:1"><div id="statusTitle" class="status-title" data-i18n="statusReading">Reading status…</div><div id="statusMeta" class="status-meta"></div><div id="statusDetail" class="status-detail" hidden></div></div>
  </section>

  <section class="card sync-card"><button type="button" id="sync" class="primary full"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.8L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.8L21 14"/><path d="M21 19v-5h-5"/></svg> <span data-i18n="syncNow">Sync now</span></button></section>

  <section class="card">
    <p class="section-label" data-i18n="restoreData">Restore data</p>
    <div class="grid-2">
      <button type="button" id="restore" class="action-tile"><span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg></span><span class="action-copy"><span class="action-name" data-i18n="tabs">Tabs</span><span class="action-desc" data-i18n="windowsGroups">Windows + groups</span></span></button>
      <button type="button" id="restoreBookmarks" class="action-tile"><span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><path d="m12 17-4.2 2.3 1-4.7-3.7-3.2 4.9-.5L12 6.5l2 4.4 4.9.5-3.7 3.2 1 4.7z"/></svg></span><span class="action-copy"><span class="action-name" data-i18n="bookmarks">Bookmarks</span><span class="action-desc" data-i18n="mergeLocal">Merge with local bookmarks</span></span></button>
      <button type="button" id="checkExtensions" class="action-tile"><span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3h8v4h3v14H5V7h3z"/><path d="M9 12h6M9 16h4"/></svg></span><span class="action-copy"><span class="action-name" data-i18n="extensions">Extensions</span><span class="action-desc" data-i18n="checkMissing">Check missing items</span></span></button>
      <button type="button" id="history" class="action-tile"><span class="action-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/><path d="M4 5v4h4"/></svg></span><span class="action-copy"><span class="action-name" data-i18n="history">History</span><span class="action-desc" data-i18n="rollbackConflicts">Rollback + conflicts</span></span></button>
    </div>
    <div id="missing" class="missing-list"></div>
  </section>

  <footer class="split small muted popup-footer">
    <div class="popup-footer-meta"><span id="revision">Revision 0</span><button type="button" id="checkUpdates" class="secondary footer-action footer-update-action">Check for updates</button></div>
    <span class="popup-footer-actions"><button type="button" id="guide" class="secondary footer-action" data-i18n="guide">User guide</button><button type="button" id="options" class="secondary footer-action" data-i18n="settings">Settings</button></span>
  </footer>
</main>
<script src="runtime.js"></script><script src="theme.js"></script><script src="i18n.js"></script><script src="popup.js"></script><script src="update.js"></script>
</body></html>
