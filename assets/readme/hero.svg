<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Chromium Cloud Sync</title>
  <desc id="desc">A project-native hero graphic showing Chromium browser windows connected directly to GitHub Gist revisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#0d1825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3b0"/>
      <stop offset="1" stop-color="#6ec5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <g opacity="0.32">
    <path d="M0 420H1600" stroke="#29405b"/>
    <path d="M0 90H1600" stroke="#29405b"/>
    <path d="M180 0V520M420 0V520M1180 0V520M1420 0V520" stroke="#22364f"/>
  </g>
  <g transform="translate(92 96)">
    <text x="0" y="0" fill="#7dd3b0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="5">GITHUB-BACKED CHROMIUM SYNC</text>
    <text x="0" y="86" fill="#f3f7fb" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="66" font-weight="800">Chromium Cloud Sync</text>
    <text x="0" y="135" fill="#aab9ca" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="25">Your browser state. Your GitHub Gist. No project-owned sync server.</text>
    <rect x="0" y="182" width="420" height="3" rx="2" fill="url(#accent)"/>
    <g transform="translate(0 230)">
      <rect x="0" y="0" width="146" height="54" rx="16" fill="#172438" stroke="#38516b"/>
      <text x="73" y="34" text-anchor="middle" fill="#dce7f0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">Manifest V3</text>
      <rect x="160" y="0" width="146" height="54" rx="16" fill="#172438" stroke="#38516b"/>
      <text x="233" y="34" text-anchor="middle" fill="#dce7f0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">Plain JSON</text>
      <rect x="320" y="0" width="174" height="54" rx="16" fill="#172438" stroke="#38516b"/>
      <text x="407" y="34" text-anchor="middle" fill="#dce7f0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">Native Revisions</text>
    </g>
  </g>
  <g transform="translate(1110 92)">
    <g filter="url(#glow)">
      <rect x="0" y="70" width="270" height="170" rx="24" fill="#152235" stroke="#5c7997" stroke-width="2"/>
      <rect x="22" y="96" width="226" height="108" rx="16" fill="#0d1725" stroke="#2f475f"/>
      <circle cx="32" cy="84" r="5" fill="#f28c8c"/><circle cx="51" cy="84" r="5" fill="#f4cf75"/><circle cx="70" cy="84" r="5" fill="#82d2a5"/>
      <path d="M44 131h188M44 157h145M44 183h175" stroke="#506983" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M270 155C340 155 340 155 402 155" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M392 145l16 10-16 10" fill="none" stroke="#6ec5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(418 54)">
      <circle cx="88" cy="101" r="86" fill="#16283a" stroke="#6ec5ff" stroke-width="3"/>
      <path d="M44 74h89v58H44z" fill="#0d1725" stroke="#7dd3b0" stroke-width="3"/>
      <path d="M56 91h64M56 108h52M56 125h42" stroke="#7dd3b0" stroke-width="5" stroke-linecap="round"/>
      <path d="M29 160c31 25 88 25 118 0" fill="none" stroke="#6ec5ff" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="208" text-anchor="middle" fill="#e4edf5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700">GitHub Gist</text>
    </g>
    <g transform="translate(450 286)">
      <circle cx="9" cy="9" r="9" fill="#7dd3b0"/>
      <text x="30" y="15" fill="#9fb0c2" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16">read · merge · write · revise</text>
    </g>
  </g>
</svg>
