<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Chromium Cloud Sync</title>
  <desc id="desc">A Chromium browser sync illustration showing browser state flowing through a private GitHub Gist and back to another browser.</desc>
  <defs>
