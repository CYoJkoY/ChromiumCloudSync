      <stop offset="0.5" stop-color="#6F8BFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#315EFB" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
