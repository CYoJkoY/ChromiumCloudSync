[package]
name = "ccsync-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
base64 = "=0.22.1"
fs2 = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
sysinfo = "=0.33.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
rusty-leveldb = "=4.0.1"
libc = "=0.2.172"

[dev-dependencies]
tempfile = "=3.19.1"
